<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play-by-play</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-width: 60rem;
    margin: 1rem auto;
    padding: 0 1rem;
  }
  a { color: inherit; }
  nav a { margin-right: 1.5ch; }
  nav a.on { font-weight: bold; text-decoration: none; }
  h1 { font-size: 1rem; margin: 1rem 0 0; }
  #status { opacity: .6; margin: .25rem 0 1rem; }
  .game, .play { white-space: pre-wrap; }
  .game.live, .play.scoring { font-weight: bold; }
  /* hanging indent: wrapped play text lines up after the 24-character prefix */
  .play { padding-left: 24ch; text-indent: -24ch; }
  label { margin-right: 2ch; white-space: nowrap; }
  @media (max-width: 40rem) {
    .play { padding-left: 0; text-indent: 0; margin-bottom: .3rem; }
  }
</style>
</head>
<body>
<nav id="leagues"></nav>
<main id="main"></main>
<script>
// Data: ESPN's public (undocumented) JSON API, which accepts requests from any site.
const API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/';
const LEAGUES = {
  nba:   { name: 'NBA',   path: 'nba' },
  wnba:  { name: 'WNBA',  path: 'wnba' },
  ncaam: { name: 'NCAAM', path: 'mens-college-basketball',   list: '?groups=50&limit=500', halves: true },
  ncaaw: { name: 'NCAAW', path: 'womens-college-basketball', list: '?groups=50&limit=500' },
};
const LIVE_MS = 10000;  // refresh interval while a game is in progress
const PRE_MS  = 60000;  // game hasn't started yet
const LIST_MS = 30000;  // list of today's games

const params = new URLSearchParams(location.search);
const key = LEAGUES[params.get('league')] ? params.get('league') : 'nba';
const league = LEAGUES[key];
const gameId = params.get('game');
const $ = id => document.getElementById(id);

$('leagues').innerHTML = Object.entries(LEAGUES)
  .map(([k, l]) => `<a href="?league=${k}"${k === key ? ' class="on"' : ''}>${l.name}</a>`)
  .join('');

async function getJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// Start time in your own time zone, with the date when it isn't today
// (on days with no games, ESPN lists the next day that has some).
function localTime(iso) {
  const d = new Date(iso);
  const opts = { hour: 'numeric', minute: '2-digit' };
  if (d.toDateString() !== new Date().toDateString()) Object.assign(opts, { month: 'short', day: 'numeric' });
  return d.toLocaleString([], opts);
}
const side = (comp, homeAway) => comp.competitors.find(c => c.homeAway === homeAway);

function matchup(comp, state) {
  const a = side(comp, 'away'), h = side(comp, 'home');
  const at = comp.neutralSite ? 'vs' : '@';
  return state === 'pre'
    ? `${a.team.abbreviation} ${at} ${h.team.abbreviation}`
    : `${a.team.abbreviation} ${a.score} ${at} ${h.team.abbreviation} ${h.score}`;
}

function stamp(note) {
  $('status').textContent = 'updated ' + new Date().toLocaleTimeString() + (note ? ' · ' + note : '');
}

// ---------- today's games ----------
async function updateList() {
  const data = await getJSON(API + league.path + '/scoreboard' + (league.list || ''));
  const events = data.events || [];
  const box = $('games');
  if (!events.length) box.textContent = 'No games today.';
  else box.replaceChildren(...events.map(ev => {
    const comp = ev.competitions[0], st = ev.status.type;
    const label = matchup(comp, st.state);
    const link = document.createElement('a');
    link.href = `?league=${key}&game=${ev.id}`;
    link.textContent = label;
    const row = document.createElement('div');
    row.className = 'game' + (st.state === 'in' ? ' live' : '');
    row.append(link, ' '.repeat(Math.max(2, 24 - label.length)) +
                     (st.state === 'pre' ? localTime(ev.date) : st.shortDetail));
    return row;
  }));
  stamp();
  return LIST_MS;
}

// ---------- one game's play-by-play ----------
let game = null;  // { plays, teams } from the latest fetch

function periodLabel(n) {
  const reg = league.halves ? 2 : 4;  // men's college plays halves
  if (n <= reg) return (league.halves ? 'H' : 'Q') + n;
  return (n - reg > 1 ? n - reg : '') + 'OT';
}

function renderPlays() {
  if (!game) return;
  let plays = game.plays;
  if ($('scoring').checked) plays = plays.filter(p => p.scoringPlay);
  if ($('newest').checked) plays = plays.slice().reverse();
  const box = $('plays');
  if (!plays.length) {
    box.textContent = game.plays.length ? 'No scoring plays yet.' : 'No plays yet.';
    return;
  }
  box.replaceChildren(...plays.map(p => {
    const row = document.createElement('div');
    row.className = 'play' + (p.scoringPlay ? ' scoring' : '');
    row.textContent = [
      periodLabel(p.period?.number ?? 0).padEnd(3),
      (p.clock?.displayValue ?? '').padStart(5),
      `${p.awayScore}-${p.homeScore}`.padStart(7),
      (game.teams[p.team?.id] ?? '').padEnd(5),
      (p.text ?? '').replace(/\s+/g, ' ').trim(),
    ].join(' ');
    return row;
  }));
}

async function updateGame() {
  const data = await getJSON(API + league.path + '/summary?event=' + encodeURIComponent(gameId));
  const comp = data.header.competitions[0], st = comp.status.type;
  const title = matchup(comp, st.state) + ' · ' +
                (st.state === 'pre' ? 'starts ' + localTime(comp.date) : st.shortDetail);
  $('title').textContent = document.title = title;
  const teams = {};
  for (const c of comp.competitors) teams[c.team.id] = c.team.abbreviation;
  game = { plays: data.plays || [], teams };
  renderPlays();
  if (st.state === 'in')  { stamp(`refreshing every ${LIVE_MS / 1000} s`); return LIVE_MS; }
  if (st.state === 'pre') { stamp('waiting for tip-off'); return PRE_MS; }
  stamp('game over');
  return 0;  // finished: stop refreshing
}

// ---------- page setup and refresh loop ----------
const main = $('main');
if (gameId) {
  main.innerHTML = `
    <p><a href="?league=${key}">← ${league.name} games</a></p>
    <h1 id="title">Loading…</h1>
    <p id="status"></p>
    <p><label><input type="checkbox" id="newest" checked> newest first</label>
       <label><input type="checkbox" id="scoring"> scoring plays only</label></p>
    <div id="plays"></div>`;
  $('newest').onchange = $('scoring').onchange = renderPlays;
} else {
  document.title = league.name + ' play-by-play';
  main.innerHTML = '<p id="status">Loading…</p><div id="games"></div>';
}

let timer, busy = false;
async function tick() {
  if (busy) return;
  busy = true;
  clearTimeout(timer);
  let next = gameId ? LIVE_MS : LIST_MS;  // retry interval if the request fails
  try {
    next = await (gameId ? updateGame() : updateList());
  } catch (err) {
    $('status').textContent = "couldn't load data (" + err.message + '), retrying…';
  }
  busy = false;
  if (next) timer = setTimeout(tick, next);
}
// Browsers throttle timers in background tabs, so refresh as soon as the tab is visible again.
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
tick();
</script>
</body>
</html>
